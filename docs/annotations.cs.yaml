# Ruční texty k tabulkám elementů – JEDINÝ ručně psaný vstup tabulek.
# Třída:
#   _: úvodní věta tabulky
#   element:
#     ndic: pravidlo NDIC – zobrazí se za definicí (note: by definici nahradil)
#     card: '1..1'   # pravidlo NDIC nad rámec schématu (tmavě modře)
#     required: true # NDIC vždy vyplňuje
#     values: {literal: překlad}
# _enum: {Enum.literal: překlad} – přepisuje sdílený slovník kitu
# Převzato z dokumentace cz-ndic_d2-vms-table-v1.1 (tabulky elementů), upraveno pro DATEX II 3.7.

VmsTablePublication:
  feedType:
    ndic: Identifikátor zdroje dat, ze kterého zpráva pochází, např.
      `x-source:cz-ndic_d2-vms-table-fixed-pull-v3`. Formát určují atributy `@profileName` a `@profileVersion`.
  publicationTime:
    ndic: Čas vytvoření obsahu publikace; nezměnil-li se obsah, zůstává původní.
  publicationCreator:
    ndic: 'Poskytovatel publikace: `country` = `cz`, `nationalIdentifier` = zkratka poskytovatele (NDIC).'
  headerInformation:
    ndic: Vždy `confidentiality` = `noRestriction` a `informationStatus` = `real`.
  vmsControllerTable:
    card: 1..1
    ndic: Publikace obsahuje vždy jednu tabulku řadičů; tabulky rozdělené podle typu (viz `@id` tabulky) se
      publikují samostatně.
VmsControllerTable:
  informationManager:
    ndic: 'Tvůrce obsahu publikace: `country` = `cz`, `nationalIdentifier` = NDIC.'
  vmsController:
    ndic: Jeden řadič – portál s liniovým řízením či ZPI, mobilní vozík či proměnná značka podél pozemní
      komunikace. Identifikátor `@id` je jedinečný, `@version` odpovídá vydání sítě Global Network (např. `260601`).
VmsController:
  numberOfVms:
    ndic: Počet fyzických VMS na portálu, sloupku…
  externalIdentifier:
    ndic: URL obrázku základní konfigurace řadiče s vyznačenými plochami (VMS a činné plochy)
      a všemi neměnnými částmi značky důležitými pro její pochopení (`https://mobilitydata.rsd.cz/VMS/<id řadiče>`);
      poslední segment URL je shodný s `@id` řadiče, evidenční číslo prvek nenese.
  vms:
    ndic: Jedna VMS s jednou či více činnými plochami; `@vmsIndex` od 1, číslováno zleva doprava
      a shora dolů.
Vms:
  lanternsPresent:
    ndic: '`true`, jsou-li přítomny oddělené blikače či je pro ně vyhrazena část matice VMS.'
  owner:
    ndic: Např. ŘSD, TSK.
  physicalSupport:
    values:
      roadsideMounted: podél pozemní komunikace na sloupku
      roadsideCantileverMounted: na poloportálu
      gantryMounted: na portálu
      trailerMounted: na vozíku
      centralReservationMounted: ve středním dělicím pásu
      overheadBridgeMounted: na křižujícím mostě
      tunnelEntranceMounted: na vjezdu do tunelu
      vehicleMounted: na vozidle
  vmsType:
    values:
      fullMatrixSign: plně programovatelná matice
      rotatingPrismSign: hranolová značka (pevné symboly zobrazované otočením hranolu)
      monochromeGraphic: jednobarevná grafická VMS (teplota, parkování)
      simpleMatrixSign: standardní VMS s předdefinovanými možnostmi
      other: plechové značky
  vmsTypeCode:
    ndic: 'Rozlišení značek NDIC: `mobileVariableMessageSign` (PDZ a PIT na vozíku), `variableInformationPanel`
      (výstražná PDZ 0–2 a PIT), `variableMessageSign` (PDZ s dodatkovou tabulkou, též hranolové značky), `variableDirectionSign`
      (proměnná spojitá směrová značka), `temperature` (PIT se dvěma řádky o teplotě), `parking` (PIT
      s obsazeností parkovišť), `metalSign` (neproměnná značka).'
  dynamicallyConfigurable:
    ndic: '`true`, je-li plocha VMS dynamicky konfigurovatelná – jen u `fullMatrixSign`, jinak `false`.'
  heightAboveCarriageway:
    ndic: Výška nad vozovkou v metrech u značek na portálu nad komunikací, jinak se vynechá.
  dedicatedUsage:
    ndic: 'Jen je-li značka vyhrazena: `laneControlSystem` (zákazové a příkazové značky na portálu),
      `parkingInformation` (navigace na parkoviště), `tunnelManagement` (řízení tunelu a v tunelu).'
  vmsLocation:
    ndic: Poloha VMS (`loc:PointLocation`) včetně doplňkového popisu – souřadnice, staničení a Global Network.
      U vozíků se neuvádí (lze uvést polohu depa).
  imageLink:
    card: 1..1
    ndic: URL aktuálního zobrazení VMS včetně všech činných ploch a dodatkových tabulek.
VmsConfiguration:
  displayArea:
    ndic: Činná plocha typu `vms:PictogramDisplayArea` nebo `vms:TextDisplayArea`; `@displayAreaIndex`
      od 1, shora dolů a zleva doprava.
DisplayArea:
  positionXAbsolute:
    ndic: Vodorovná poloha vůči okraji VMS (`onLeft`, `inTheMiddle`, `onRight`).
  positionYAbsolute:
    ndic: Svislá poloha vůči okraji VMS (`atTop`, `inTheMiddle`, `atBottom`).
  positionXRelativeToPrevious:
    ndic: Vodorovná poloha vůči předchozí ploše (`toTheRight`).
  positionYRelativeToPrevious:
    ndic: Svislá poloha vůči předchozí ploše (`alignedOnTheBottomSide`).
TextDisplayArea:
  textCodeListIdentifier:
    ndic: Identifikátor tabulky kódovaných frází zobrazovaných na PIT (např. `cz-phrase-code-list-v1.0`);
      ne všechny fráze musí mít kódovaný význam.
PictogramDisplayArea:
  pictogramCodeListIdentifier:
    ndic: Identifikátor tabulky kódovaných piktogramů (např. `cz-pictogram-code-list-v1.1`) – zpravidla
      mapování významu dopravních značek do DATEX II s doplňkovými informacemi.
  pictogramNumberOfColours:
    ndic: Počet barev, např. `3` u `simpleMatrixSign` (červená – okraj, bílá – symbol, oranžová – blikače,
      černé pozadí).
PointLocation:
  pointByCoordinates:
    ndic: Souřadnice ETRS89.
  pointAlongLinearElement:
    card: 1..2
    ndic: 'Poloha podél komunikace: staničení (číslo komunikace `roadNumber`, u místních komunikací název `roadName`, vzdálenost od počátku v metrech)
      a nepovinně Global Network (`CZ-RSD-GlobalNetwork`, vzdálenost od počátku úseku v procentech 0–100).'
NetworkLocation:
  supplementaryPositionalDescription:
    ndic: Doplňkový popis polohy VMS na úrovni jízdního pruhu včetně názvu a směru silnice.
SupplementaryPositionalDescription:
  positionOnCarriageway:
    card: 1..1
    ndic: 'Umístění VMS na konstrukci: `onTheLeft` (na sloupu vlevo po směru jízdy), `inTheCentre` (na příčníku
      nad vozovkou, i poloportál), `onTheRight` (na sloupu vpravo po směru jízdy).'
  carriageway:
    card: 1..1
    ndic: Jízdní pás a pruh, pro který VMS platí.
  roadInformation:
    card: 1..1
    ndic: Směr (`roadDestination`), název (`roadName`) a číslo (`roadNumber`) komunikace, na které VMS leží.
Carriageway:
  carriageway:
    ndic: Vždy `mainCarriageway`.
  originalNumberOfLanes:
    ndic: Uvádí se, je-li znám.
  lane:
    card: 1..1
    ndic: '`laneNumber` (1 = první pruh zprava, 0 = zpevněná krajnice), řídí-li VMS jízdní pruh, nebo
      `laneUsage` = `allLanesCompleteCarriageway`, platí-li pro celý jízdní pás.'
PointCoordinates:
  latitude:
    ndic: Zeměpisná šířka ETRS89 na průsečíku středu jízdního pásu a kolmice ke konstrukci VMS.
  longitude:
    ndic: Zeměpisná délka ETRS89.
PointAlongLinearElement:
  directionRelativeAtPoint:
    ndic: Směr vůči staničení či kódování úseku Global Network (`aligned`, `opposite`).
  linearElement:
    ndic: 'Staničení: `loc:LinearElement` s `roadNumber` (u místních komunikací `roadName`); Global Network:
      `loc:LinearElementByCode` s modelem `CZ-RSD-GlobalNetwork`, verzí sítě a identifikátorem úseku.'
  distanceAlongLinearElement:
    ndic: '`loc:DistanceFromLinearElementStart` (staničení v metrech, nemusí odpovídat skutečné vzdálenosti od počátku komunikace) nebo `loc:PercentageDistanceAlongLinearElement`
      (procenta délky úseku Global Network od jeho počátku, 0–100).'

_enum: {}
